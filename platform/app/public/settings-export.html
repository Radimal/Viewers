<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Radimal viewer settings export</title>
  </head>
  <body>
    <script>
      // Loaded in a hidden iframe by view.radimal.ai / veg-view on a reader's first 3.13
      // visit (src/utils/importCanarySettings.js). Posts this origin's viewer
      // preferences to the parent. postMessage's targetOrigin makes the
      // browser drop the message unless the parent is one of these origins.
      (function () {
        var PARENTS = [
          'https://view.radimal.ai',
          'https://veg-view.prod-1.radimal.ai',
          'http://localhost:3000',
        ];
        // Keep in sync with src/utils/canarySettingKeys.js.
        var KEYS = [
          'user-preferred-keys', 'hotkeys-migrated', 'user-preferred-tool-bindings',
          'defaultToolBindings-migrated', 'scrollWheelTool', 'invertScrollWheel', 'zoomSpeed',
          'zoomTowardCursor', 'userLayoutPreference', 'openAdditionalWindowsOnStart',
          'windowsArray', 'pinnedToolbarTools', 'ohif:theme', 'ohif:custom-theme-css',
          'i18nextLng', 'shownTours', 'investigationalUseDialog',
        ];
        var settings = {};
        var lastUsedAt = null;
        try {
          lastUsedAt = localStorage.getItem('viewerLastUsedAt');
          KEYS.forEach(function (key) {
            var value = localStorage.getItem(key);
            if (value !== null) {
              settings[key] = value;
            }
          });
        } catch (e) {
          settings = {};
        }
        if (window.parent && window.parent !== window) {
          PARENTS.forEach(function (origin) {
            window.parent.postMessage(
              { type: 'radimal-settings-export', settings: settings, lastUsedAt: lastUsedAt },
              origin
            );
          });
        }
      })();
    </script>
  </body>
</html>
