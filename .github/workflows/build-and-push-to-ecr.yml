name: Build and Push OHIF container

# v3.13 baseline branch (vanilla OHIF 3.13.3 + Radimal CI only).
#
# STAGING ONLY — this branch's asset sync must NEVER include the prod buckets
# (radimal-viewer-assets-prod-1, radimal-viewer-assets-veg-prod-1). CloudFront
# serves *.js/*.css/fonts/images for every cluster in a stack from that stack's
# bucket root, so syncing here overwrites unhashed shared files
# (init-service-worker.js, sw.js, assets/*, logos) for whatever version is live
# on the stack. To restore 3.10 assets after testing, re-run the build on the
# current v3.10.* branch.

on:
  push:
    branches:
      - 'v3.13.*'

env:
  ECR: ${{secrets.ECR_OHIF_LOCATION}}
  AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID_GH_ORTHANC }}
  AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY_GH_ORTHANC }}
  AWS_DEFAULT_REGION: us-east-1

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_GH_ORTHANC }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_GH_ORTHANC }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # Caching support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v4
        with:
          file: Dockerfile
          tags: |
            "${{ env.ECR }}:${{ github.ref_name }}"
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract dist from built image
        run: |
          docker pull "${{ env.ECR }}:${{ github.ref_name }}"
          CID=$(docker create "${{ env.ECR }}:${{ github.ref_name }}")
          docker cp "$CID:/usr/share/nginx/html" ./dist
          docker rm "$CID"

      - name: Read version from build
        id: version
        run: |
          # Vanilla 3.13 does not emit version.json (that is a fork feature);
          # fall back to the branch name so the versioned S3 copy still works.
          if [ -f ./dist/version.json ]; then
            VERSION=$(jq -r '.version' ./dist/version.json)
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected build version: $VERSION"

      - name: Upload static assets to S3 (staging buckets ONLY)
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"

          # stage-1 only for now. Add s3://radimal-viewer-assets-veg-stage-1
          # when ready to test on VEG staging. Never add prod buckets here.
          for BUCKET in s3://radimal-viewer-assets-stage-1; do
            # Flat copy at bucket root for serving via CloudFront
            aws s3 sync ./dist "$BUCKET/" \
              --exclude "index.html" \
              --exclude "app-config.js" \
              --exclude "google.js" \
              --cache-control "public, max-age=31536000, immutable"

            # Versioned copy for tracking deployed builds
            aws s3 sync ./dist "$BUCKET/$VERSION/" \
              --exclude "index.html" \
              --exclude "app-config.js" \
              --exclude "google.js" \
              --cache-control "public, max-age=31536000, immutable"
          done
